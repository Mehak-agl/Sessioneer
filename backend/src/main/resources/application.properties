spring.application.name=sessioneer
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sessioneer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mehak21}
spring.datasource.driver-class-name=org.postgresql.Driver

# Comma-separated frontend origins allowed to call the API (wildcards ok, e.g. https://*.vercel.app)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set JWT_SECRET in .env / on the host; the fallback is only for local dev and is public in git
jwt.secret=${JWT_SECRET:sessioneer-super-secret-key-qut-2026-must-be-long-enough-for-hmac}
jwt.expiration=86400000

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Mail credentials come from .env / the host - never commit the app password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
